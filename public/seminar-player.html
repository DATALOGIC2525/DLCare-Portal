<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    /* コンテナが画面を占有しすぎないように調整 */
    #uliza-player-container { width: 100%; height: 100%; }
    /* Ulizaプレイヤーが生成する要素を画面いっぱいに広げる */
    .uliza-player-wrapper, .uliza-player-container, [id^="uliza-player-"] { 
      width: 100% !important; 
      height: 100% !important; 
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <div id="uliza-player-container"></div>
  <script type="text/javascript" charset="utf-8" defer src="https://player-api.p.uliza.jp/v1/playlists/umekomi/datalogic/admin?name=playlist-2026-05-01-15-26-14-685-264937b8">//{"playlist":{"playlistType":"right_normal","repeatType":"none"},"videoAnalytics":{"userId":"[GAUSERID]"}}</script>
</body>
</html>
